# This file is for production.

spring.application.name=hy-all

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:false}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

server.port=8080

spring.datasource.url=jdbc:mysql://ipaddress:3306
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${REMOTEUSER}
spring.datasource.password=${REMOTEPASS}

# JWT
jwt.secret=${JWTSECRET}

spring.jackson.mapper.accept-case-insensitive-properties=true
